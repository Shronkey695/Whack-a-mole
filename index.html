<!DOCTYPE html>
<html>
    <head>
        <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    </head>
    <body>
        <a-scene>
        <a-plane src="images.jpg" rotation="-90 0 0" position="0 1 0" width="4" height="4"></a-plane>
        
        <a-sky color="blue"></a-sky>
        
        <a-torus color=black position="0 0.85 -1.5" radius="0.3" radius-tubular="0.1" rotation="-90"
        ></a-torus>
        
         <a-torus color=black position="-1.5 0.85 0" radius="0.3" radius-tubular="0.1" rotation="-90"
        ></a-torus>
        
        <a-torus color=black position="1.5 0.85 0" radius="0.3" radius-tubular="0.1" rotation="-90"
        ></a-torus>
        
        <a-torus color=black position="-1 0.85 1.5" radius="0.3" radius-tubular="0.1" rotation="-90"
        ></a-torus>
        
        <a-torus color=black position="1 0.85 1.5" radius="0.3" radius-tubular="0.1" rotation="-90"
        ></a-torus>
        
        <a-cylinder src="images (1).jpg" position="0 0 -1.5" height="1" radius="0.2"
        animation="
        property: position;
        from: 0 0 -1.5;
        to: 0 0.85 -1.5;
        loop: true;
        dur: 2500;
        dir: alternate;"
        animation__2="
        property: visible;
        from: true;
        to: false;
        startEvents: click;"></a-cylinder>
        
         <a-cylinder src="images (1).jpg" position="-1.5 0 0" height="1" radius="0.2"
          animation="
        property: position;
        from: -1.5 0 0;
        to: -1.5 0.85 0;
        loop: true;
        dur: 2500;
        dir: alternate;
        delay: 3000;"
        animation__2="
        property: visible;
        from: true;
        to: false;
        startEvents: click;"></a-cylinder>
         
          <a-cylinder src="images (1).jpg" position="1.5 0 0" height="1" radius="0.2"
           animation="
        property: position;
        from: 1.5 0 0;
        to: 1.5 0.85 0;
        loop: true;
        dur: 2500;
        dir: alternate;
        delay: 4000;"
        animation__2="
        property: visible;
        from: true;
        to: false;
        startEvents: click;"></a-cylinder>
          
           <a-cylinder src="images (1).jpg" position="-1 0 1.5" height="1" radius="0.2"
            animation="
        property: position;
        from: -1 0 1.5;
        to: -1 0.85 1.5;
        loop: true;
        dur: 2500;
        dir: alternate;
        delay: 1000"
        animation__2="
        property: visible;
        from: true;
        to: false;
        startEvents: click;"></a-cylinder>
           
            <a-cylinder src="images (1).jpg" position="1 0 1.5" height="1" radius="0.2"
             animation="
        property: position;
        from: 1 0 1.5;
        to: 1 0.85 1.5;
        loop: true;
        dur: 2500;
        dir: alternate;
        delay: 7000;"
        animation__2="
        property: visible;
        from: true;
        to: false;
        startEvents: click;"></a-cylinder>
            
            <a-camera>
                <a-cursor></a-cursor>
            </a-camera>
        
        </a-scene>
    </body>
</html>
